:root{--accent:#F6C627;--ground:#1F1F21;--dove:#E0E0E0;--gray:#A1A1A1;--white:#FFFFFF}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--ground);-webkit-text-size-adjust:100%}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ground);color:var(--dove);font-family:'Helvetica Neue',Arial,sans-serif;font-size:17px;line-height:1.55;padding:32px 20px}
main{max-width:560px;width:100%}
.logo{width:44px;height:44px;margin-bottom:28px}
.eyebrow{display:block;font-family:'SUPR','Arial Narrow',sans-serif;font-weight:700;letter-spacing:.14em;font-size:13px;color:var(--accent);margin-bottom:14px}
h1{font-family:'SUPR','Arial Narrow',sans-serif;font-weight:700;font-size:clamp(40px,9vw,64px);line-height:.95;letter-spacing:.01em;color:var(--white);text-transform:uppercase;margin-bottom:18px}
p{margin-bottom:14px;max-width:44ch}
.typed{color:var(--gray);font-size:14px;word-break:break-all}
.typed b{color:var(--dove);font-weight:600}
.btn{display:inline-block;margin-top:14px;background:var(--accent);color:#1F1F21;text-decoration:none;font-family:'SUPR','Arial Narrow',sans-serif;font-weight:700;letter-spacing:.08em;font-size:15px;padding:16px 26px;border-radius:999px}
.btn:hover{filter:brightness(1.06)}
</style>
</head>
<body>
<main>
  <img class="logo" src="/favicon-192.png" alt="" width="44" height="44">
  <span class="eyebrow">STRINGER STEPS</span>
  <h1>That page didn't land.</h1>
  <p>Check the spelling, or pick a guide from the library. Every guide lives at stringersteps.com followed by one word.</p>
  <p class="typed" id="typed" hidden>You typed: <b id="typedPath"></b></p>
  <a class="btn" href="/">OPEN THE LIBRARY &rarr;</a>
</main>
<script>
(function(){var p=location.pathname;if(p&&p!=='/'){document.getElementById('typedPath').textContent=p;document.getElementById('typed').hidden=false;}})();
</script>
</body>
</html>
